<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PSYCH HISTORY M.A.S.</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen">
    <div id="root"></div>

    <script type="text/babel">
        function App() {
            const [activeTab, setActiveTab] = React.useState('home');
            const [darkMode, setDarkMode] = React.useState(true);

            const scholars = [
                { name: "উইলহেল্ম উন্ট (Wilhelm Wundt)", years: "১৮৩২-১৯২০", country: "জার্মানি", school: "গঠনবাদ", desc: "পরীক্ষামূলক মনোবিজ্ঞানের জনক।" },
                { name: "উইলিয়াম জেমস (William James)", years: "১৮৪২-১৯১০", country: "যুক্তরাষ্ট্র", school: "কার্যবাদ", desc: "আমেরিকান মনোবিজ্ঞানের জনক ও কার্যবাদের প্রবক্তা।" },
                { name: "সিগমন্ড ফ্রয়েড (Sigmund Freud)", years: "১৮৫৬-১৯৩৯", country: "অস্ট্রিয়া", school: "মনোসমীক্ষণ", desc: "অচেতন মন ও মনোসমীক্ষণ তত্ত্বের প্রবক্তা।" },
                { name: "জন বি ওয়াটসন (John B. Watson)", years: "১৮৭৮-১৯৫৮", country: "যুক্তরাষ্ট্র", school: "আচরণবাদ", desc: "আচরণবাদের প্রতিষ্ঠাতা।" }
            ];

            return (
                <div className="flex flex-col min-h-screen p-4 max-w-4xl mx-auto">
                    <header className="flex justify-between items-center mb-6 bg-slate-800 p-4 rounded-xl shadow border border-slate-700">
                        <div>
                            <h1 className="text-xl font-bold text-purple-400">PSYCH HISTORY M.A.S.</h1>
                            <p className="text-xs text-slate-400">জাতীয় বিশ্ববিদ্যালয় • কোর্স: ২৩৩৪০১</p>
                        </div>
                        <button onClick={() => setDarkMode(!darkMode)} className="bg-purple-600 px-3 py-1 rounded text-sm font-medium">
                            {darkMode ? 'লাইট মোড' : 'ডার্ক মোড'}
                        </button>
                    </header>

                    <nav className="flex gap-2 overflow-x-auto pb-2 mb-6">
                        <button onClick={() => setActiveTab('home')} className={`px-4 py-2 rounded-lg font-medium whitespace-nowrap ${activeTab === 'home' ? 'bg-purple-600' : 'bg-slate-800 border border-slate-700'}`}>🏠 হোম</button>
                        <button onClick={() => setActiveTab('library')} className={`px-4 py-2 rounded-lg font-medium whitespace-nowrap ${activeTab === 'library' ? 'bg-purple-600' : 'bg-slate-800 border border-slate-700'}`}>📚 লাইব্রেরি</button>
                        <button onClick={() => setActiveTab('comparison')} className={`px-4 py-2 rounded-lg font-medium whitespace-nowrap ${activeTab === 'comparison' ? 'bg-purple-600' : 'bg-slate-800 border border-slate-700'}`}>⚖️ তুলনা কেন্দ্র</button>
                        <button onClick={() => setActiveTab('ai')} className={`px-4 py-2 rounded-lg font-medium whitespace-nowrap ${activeTab === 'ai' ? 'bg-purple-600' : 'bg-slate-800 border border-slate-700'}`}>🤖 AI শিক্ষক</button>
                    </nav>

                    <main className="flex-grow">
                        {activeTab === 'home' && (
                            <div className="space-y-6">
                                <div className="bg-slate-800 p-6 rounded-2xl border border-slate-700 shadow-lg">
                                    <h2 className="text-2xl font-bold text-purple-300 mb-2">History of Psychology</h2>
                                    <p className="text-slate-300">মনোবিজ্ঞানের ইতিহাস ও ক্রমবিকাশ অধ্যয়নের জন্য একটি সম্পূর্ণ ডিজিটাল একাডেমিক প্ল্যাটফর্ম।</p>
                                    <p className="mt-4 italic text-slate-400 border-l-4 border-purple-500 pl-3">"Psychology has a long past, but only a short history." — Hermann Ebbinghaus</p>
                                </div>
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                    <div onClick={() => setActiveTab('library')} className="bg-slate-800 p-4 rounded-xl border border-slate-700 cursor-pointer hover:border-purple-500 transition">
                                        <h3 className="font-bold text-purple-400 text-lg">📚 মনোবিজ্ঞানী লাইব্রেরি</h3>
                                        <p className="text-sm text-slate-400 mt-1">মনোবিজ্ঞানী ও দার্শনিকদের জীবনী এবং অবদান জানুন।</p>
                                    </div>
                                    <div onClick={() => setActiveTab('comparison')} className="bg-slate-800 p-4 rounded-xl border border-slate-700 cursor-pointer hover:border-purple-500 transition">
                                        <h3 className="font-bold text-purple-400 text-lg">⚖️ তুলনা কেন্দ্র</h3>
                                        <p className="text-sm text-slate-400 mt-1">গঠনবাদ বনাম কার্যবাদ তুলনামূলক বিশ্লেষণ।</p>
                                    </div>
                                </div>
                            </div>
                        )}

                        {activeTab === 'library' && (
                            <div className="space-y-4">
                                <h2 className="text-2xl font-bold mb-4 text-purple-300">মনোবিজ্ঞানী ও দার্শনিক লাইব্রেরি</h2>
                                <div className="grid grid-cols-1 gap-4">
                                    {scholars.map((scholar, idx) => (
                                        <div key={idx} className="bg-slate-800 p-5 rounded-xl border border-slate-700 shadow">
                                            <h3 className="text-lg font-bold text-purple-400">{scholar.name}</h3>
                                            <p className="text-xs text-slate-400 mt-1">জীবনকাল: {scholar.years} | দেশ: {scholar.country} | মতবাদ: {scholar.school}</p>
                                            <p className="mt-3 text-sm text-slate-200">{scholar.desc}</p>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {activeTab === 'comparison' && (
                            <div>
                                <h2 className="text-2xl font-bold mb-4 text-purple-300">তুলনা কেন্দ্র (Structuralism vs Functionalism)</h2>
                                <div className="bg-slate-800 p-4 rounded-xl overflow-x-auto border border-slate-700 shadow">
                                    <table className="w-full text-left border-collapse min-w-[500px]">
                                        <thead>
                                            <tr className="border-b border-slate-700 text-purple-400">
                                                <th className="p-3">তুলনার বিষয়</th>
                                                <th className="p-3">গঠনবাদ (Structuralism)</th>
                                                <th className="p-3">কার্যবাদ (Functionalism)</th>
                                            </tr>
                                        </thead>
                                        <tbody className="text-sm text-slate-300">
                                            <tr className="border-b border-slate-700">
                                                <td className="p-3 font-semibold text-white">প্রধান প্রবক্তা</td>
                                                <td className="p-3">উইলহেল্ম উন্ট ও এডওয়ার্ড টিচনার</td>
                                                <td className="p-3">উইলিয়াম জেমস ও জন ডিউই</td>
                                            </tr>
                                            <tr className="border-b border-slate-700">
                                                <td className="p-3 font-semibold text-white">মূল লক্ষ্য</td>
                                                <td className="p-3">চেতনার মর্মের উপাদান বিশ্লেষণ করা</td>
                                                <td className="p-3">মন কীভাবে পরিবেশের সাথে খাপ খাইয়ে চলে তা অনুধাবন</td>
                                            </tr>
                                            <tr>
                                                <td className="p-3 font-semibold text-white">পদ্ধতি</td>
                                                <td className="p-3">অন্তদর্শন (Introspection)</td>
                                                <td className="p-3">পরীক্ষামূলক ও পর্যবেক্ষণমূলক পদ্ধতি</td>
                                            </tr>
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        )}

                        {activeTab === 'ai' && (
                            <div className="flex flex-col h-[65vh]">
                                <h2 className="text-2xl font-bold mb-4 text-purple-300">AI মনোবিজ্ঞান শিক্ষক</h2>
                                <div className="bg-slate-800 flex-grow p-4 rounded-xl overflow-y-auto mb-4 border border-slate-700 flex flex-col justify-end">
                                    <div className="bg-slate-700 p-3 rounded-lg max-w-[80%] text-sm text-slate-200">
                                        হ্যালো! আমি আপনার মনোবিজ্ঞান শিক্ষক। বাংলায় যেকোনো একাডেমিক প্রশ্ন করুন (যেমন: "গঠনবাদ বুঝিয়ে দিন")।
                                    </div>
                                </div>
                                <div className="flex gap-2">
                                    <input type="text" placeholder="আপনার প্রশ্ন এখানে লিখুন..." className="flex-grow p-3 rounded-xl bg-slate-800 border border-slate-700 text-white focus:outline-none focus:border-purple-500 text-sm" />
                                    <button className="bg-purple-600 px-6 py-3 rounded-xl font-bold text-sm hover:bg-purple-500 transition">পাঠান</button>
                                </div>
                            </div>
                        )}
                    </main>

                    <footer className="mt-10 text-center text-xs text-slate-500 border-t border-slate-800 pt-4">
                        MIL MESH ACHARYA (SHUVO) • M.A.S. • National University Honours 3rd Year
                    </footer>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
